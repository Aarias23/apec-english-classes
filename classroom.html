<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive classroom deck for Link It! 2 Units 1-4.">
  <title>Interactive Classroom | Link It! 2</title><link rel="stylesheet" href="assets/site.css">
</head>
<body class="classroom-page">
  <header class="classroom-bar">
    <a class="mini-brand" href="course-hub.html"><span>LI</span> Course Hub</a>
    <div class="class-meta"><strong id="lesson-label">Class 01</strong><span id="lesson-date">July 11</span><span id="page-range">SB 10–15</span></div>
    <div class="class-tools"><button id="timer-open" class="tool-button" type="button" aria-label="Open timer">&#9711; <span>Timer</span></button><button id="teacher-toggle" class="tool-button" type="button" aria-pressed="false">&#10022; <span>Teacher mode</span></button><button id="fullscreen-button" class="tool-button" type="button">&#9974; <span>Full screen</span></button></div>
  </header>
  <main class="deck-shell">
    <aside class="deck-rail" aria-label="Slide navigation"><button id="rail-toggle" class="rail-toggle" type="button" aria-label="Collapse slide list">&#9776;</button><div id="slide-list" class="slide-list"></div></aside>
    <section class="stage-wrap"><div class="progress-track"><span id="progress-bar"></span></div><article id="slide-stage" class="slide-stage" aria-live="polite"></article><div class="deck-controls"><button id="prev-slide" class="round-button" type="button" aria-label="Previous slide">&larr;</button><span id="slide-count">01 / 12</span><button id="next-slide" class="round-button dark" type="button" aria-label="Next slide">&rarr;</button></div></section>
    <aside id="teacher-panel" class="teacher-panel" aria-hidden="true"><div class="panel-heading"><div><small>PRIVATE VIEW</small><strong>Teacher Guide</strong></div><button id="teacher-close" type="button" aria-label="Close teacher guide">&times;</button></div><div id="teacher-content" class="teacher-content"></div></aside>
  </main>
  <dialog id="timer-dialog" class="timer-dialog"><form method="dialog" class="dialog-close"><button aria-label="Close timer">&times;</button></form><p class="eyebrow">CLASSROOM TIMER</p><div id="timer-display" class="timer-display">05:00</div><div class="timer-presets"><button data-minutes="2" type="button">2 min</button><button data-minutes="5" type="button">5 min</button><button data-minutes="10" type="button">10 min</button><button data-minutes="15" type="button">15 min</button></div><div class="timer-actions"><button id="timer-start" class="button primary" type="button">Start</button><button id="timer-reset" class="button ghost" type="button">Reset</button></div></dialog>
  <section id="whiteboard" class="whiteboard-overlay" aria-hidden="true" aria-label="Digital whiteboard">
    <header class="whiteboard-toolbar">
      <div class="whiteboard-heading"><span>LI</span><div><small>LIVE CLASS TOOL</small><strong>Digital Whiteboard</strong></div></div>
      <div class="whiteboard-controls" role="toolbar" aria-label="Whiteboard controls">
        <div class="whiteboard-group" aria-label="Drawing tool">
          <button class="whiteboard-tool active" type="button" data-board-tool="pen" aria-pressed="true">Pen</button>
          <button class="whiteboard-tool" type="button" data-board-tool="text" aria-pressed="false">Text</button>
          <button class="whiteboard-tool" type="button" data-board-tool="eraser" aria-pressed="false">Eraser</button>
        </div>
        <div class="whiteboard-group whiteboard-colors" aria-label="Pen color">
          <button class="whiteboard-color active" type="button" data-board-color="#17211c" style="--board-color:#17211c" aria-label="Dark green" aria-pressed="true"></button>
          <button class="whiteboard-color" type="button" data-board-color="#2457c5" style="--board-color:#2457c5" aria-label="Blue" aria-pressed="false"></button>
          <button class="whiteboard-color" type="button" data-board-color="#0f766e" style="--board-color:#0f766e" aria-label="Teal" aria-pressed="false"></button>
          <button class="whiteboard-color" type="button" data-board-color="#be123c" style="--board-color:#be123c" aria-label="Red" aria-pressed="false"></button>
          <button class="whiteboard-color" type="button" data-board-color="#b45309" style="--board-color:#b45309" aria-label="Amber" aria-pressed="false"></button>
        </div>
        <div class="whiteboard-group" aria-label="Tool size">
          <button class="whiteboard-size" type="button" data-board-size="3" data-text-size="28" aria-label="Small size" aria-pressed="false">S</button>
          <button class="whiteboard-size active" type="button" data-board-size="7" data-text-size="42" aria-label="Medium size" aria-pressed="true">M</button>
          <button class="whiteboard-size" type="button" data-board-size="14" data-text-size="58" aria-label="Large size" aria-pressed="false">L</button>
        </div>
        <button id="whiteboard-undo" class="whiteboard-action" type="button">Undo</button>
        <button id="whiteboard-clear" class="whiteboard-action" type="button">Clear</button>
      </div>
      <div class="whiteboard-exit">
        <button id="whiteboard-new-tab" class="whiteboard-action" type="button">Open in new tab</button>
        <button id="whiteboard-close" class="whiteboard-action primary" type="button">Back to class</button>
      </div>
    </header>
    <div class="whiteboard-surface">
      <canvas id="whiteboard-canvas" aria-label="Drawing surface"></canvas>
      <textarea id="whiteboard-text-editor" class="whiteboard-text-editor" aria-label="Whiteboard text" placeholder="Type here... Ctrl+Enter to place" hidden></textarea>
      <p class="whiteboard-hint">Use Pen, Eraser, or Text. Your work stays with this class on this device.</p>
    </div>
  </section>
  <script src="assets/lesson-data.js"></script><script src="assets/book-map.js"></script><script src="assets/learning-components.js"></script><script src="assets/unit2-enhanced.js"></script><script src="assets/unit3-content.js"></script><script src="assets/unit4-content.js"></script><script src="assets/classroom.js"></script>
</body>
</html>
