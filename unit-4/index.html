<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A four-hour interactive English class about jobs, abilities and workplace obligations.">
  <meta name="theme-color" content="#123b35">
  <title>People at Work | English 2 · Unit 4</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#lesson-stage">Skip to lesson</a>
  <header class="topbar">
    <button class="brand" id="home-button" type="button" aria-label="Go to the first activity"><span class="brand-mark">PW</span><span class="brand-copy"><strong>People at Work</strong><small>English 2 · Unit 4</small></span></button>
    <div class="class-status" aria-label="Class progress"><span class="status-light"></span><strong id="phase-label">Opening shift</strong><span class="divider"></span><span id="elapsed-label">0 / 240 min</span></div>
    <div class="top-actions"><button class="tool-button" id="timer-button" type="button"><span aria-hidden="true">◷</span><span>Timer</span></button><button class="tool-button" id="board-button" type="button"><span aria-hidden="true">✎</span><span>Whiteboard</span></button><button class="tool-button" id="teacher-button" type="button" aria-pressed="false"><span aria-hidden="true">✦</span><span>Teacher notes</span></button><button class="tool-button" id="fullscreen-button" type="button"><span aria-hidden="true">⛶</span><span>Present</span></button></div>
  </header>
  <main class="classroom-shell">
    <aside class="route-rail" aria-label="Lesson route"><div class="rail-head"><span>WORKDAY ROUTE</span><button id="rail-toggle" type="button" aria-label="Collapse lesson route">‹</button></div><nav id="lesson-nav"></nav><div class="route-total"><strong>240</strong><span>active minutes</span></div></aside>
    <section class="stage-shell"><div class="progress-track" aria-hidden="true"><span id="progress-bar"></span></div><article id="lesson-stage" class="lesson-stage" tabindex="-1" aria-live="polite"></article><footer class="stage-controls"><button class="nav-button" id="prev-button" type="button">← <span>Previous</span></button><div class="stage-status"><span id="stage-counter">01 / 12</span><button id="complete-button" class="complete-button" type="button" aria-pressed="false">○ Mark complete</button></div><button class="nav-button next" id="next-button" type="button"><span>Next</span> →</button></footer></section>
  </main>
  <aside class="teacher-drawer" id="teacher-drawer" aria-hidden="true"><header><div><small>PRIVATE TEACHER VIEW</small><h2>Teaching notes</h2></div><button id="teacher-close" type="button" aria-label="Close teacher notes">×</button></header><div id="teacher-content" class="teacher-content"></div></aside><button class="drawer-backdrop" id="drawer-backdrop" type="button" aria-label="Close teacher notes" tabindex="-1"></button>
  <dialog class="timer-dialog" id="timer-dialog"><form method="dialog"><button class="dialog-close" aria-label="Close timer">×</button></form><p class="eyebrow">CLASSROOM TIMER</p><div class="timer-display" id="timer-display">05:00</div><div class="timer-presets"><button type="button" data-minutes="2">2 min</button><button type="button" data-minutes="5" class="active">5 min</button><button type="button" data-minutes="10">10 min</button><button type="button" data-minutes="15">15 min</button></div><div class="timer-actions"><button type="button" id="timer-start" class="primary-button">Start</button><button type="button" id="timer-reset" class="secondary-button">Reset</button></div></dialog>
  <section class="whiteboard-overlay" id="whiteboard" aria-hidden="true" aria-label="Digital whiteboard"><header class="whiteboard-topbar"><div class="board-heading"><span>PW</span><div><small>LIVE CLASS TOOL</small><strong>Digital Whiteboard</strong></div></div><div class="board-controls" role="toolbar" aria-label="Whiteboard controls"><div class="board-group"><button class="board-tool active" data-board-tool="pen" type="button" aria-pressed="true" title="Pen (P)">Pen</button><button class="board-tool" data-board-tool="text" type="button" aria-pressed="false" title="Text (T)">Text</button><button class="board-tool" data-board-tool="eraser" type="button" aria-pressed="false" title="Eraser (E)">Eraser</button></div><div class="board-group colors"><button class="color-swatch active" data-board-color="#123b35" style="--swatch:#123b35" aria-label="Dark green" aria-pressed="true"></button><button class="color-swatch" data-board-color="#2256ba" style="--swatch:#2256ba" aria-label="Blue" aria-pressed="false"></button><button class="color-swatch" data-board-color="#c0394e" style="--swatch:#c0394e" aria-label="Red" aria-pressed="false"></button><button class="color-swatch" data-board-color="#b46a16" style="--swatch:#b46a16" aria-label="Amber" aria-pressed="false"></button></div><div class="board-group"><button class="board-size" data-board-size="4" data-text-size="30" type="button" aria-label="Small size">S</button><button class="board-size active" data-board-size="8" data-text-size="44" type="button" aria-label="Medium size">M</button><button class="board-size" data-board-size="14" data-text-size="60" type="button" aria-label="Large size">L</button></div><div class="board-group surface-options" aria-label="Board surface"><button class="surface-option active" data-board-surface="grid" type="button">Grid</button><button class="surface-option" data-board-surface="lines" type="button">Lines</button><button class="surface-option" data-board-surface="dots" type="button">Dots</button><button class="surface-option" data-board-surface="blank" type="button">Blank</button></div><button class="board-action" id="board-undo" type="button">Undo</button><button class="board-action" id="board-export" type="button">Export PNG</button><button class="board-action" id="board-clear" type="button">New board</button></div><div class="board-exit"><button class="board-action" id="board-close" type="button">Back to class</button></div></header><div class="board-surface grid"><canvas id="board-canvas" aria-label="Whiteboard drawing surface"></canvas><textarea id="board-text-editor" aria-label="Whiteboard text editor" placeholder="Type here... Ctrl+Enter to place" hidden></textarea><p class="board-status" id="board-status" role="status" aria-live="polite">Pen selected. Drag to draw.</p><p class="board-hint">P Pen · T Text · E Eraser · Ctrl+Enter place text · Escape cancel</p></div></section>
  <script src="app.js"></script><script src="board-enhanced.js"></script>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
